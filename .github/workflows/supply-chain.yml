# ESTAMPIE: the supply-chain checks (docs/SECURITY.md) on every push and pull request, and weekly, so a vulnerability
# published after a dependency was locked still turns up:
#   osv-scanner (pinned by SHA-256 in tools/toolchain.lock) over uv.lock, the Node line and the pinned build image,
#   and osv.dev over the screen reader's eSpeak NG (fm1-reader, pinned there too);
#   zizmor (pinned in uv.lock) over these workflows: pinning, permissions, injection, impostor commits.
name: supply chain

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions: {}

# A newer push to the same branch cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Vulnerabilities and workflow audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Every action pinned to a commit (a tag can be moved), its version in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3

      - name: osv-scanner and fm1-reader (checked against tools/toolchain.lock)
        run: tools/setup_toolchain.sh --only osv-scanner,fm1-reader

      - name: Known vulnerabilities (Python, Node, build image, eSpeak NG)
        run: tools/osv_scan.sh python node build-image espeak

      - name: Workflow audit (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --only-group audit zizmor --format github .github/workflows

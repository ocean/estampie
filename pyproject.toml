# ESTAMPIE: the Python the build, the tools and the tests use. Not a package: uv keeps .venv in step with uv.lock
# (hash-pinned). Pillow, fontTools and NumPy are pinned exactly as CI pins them: tools/gen_samples.py's results, and so
# the golden renders, follow their (and Python 3.14's) float summation.
#   uv sync --frozen          (tools/setup_toolchain.sh)
[project]
name = "estampie-tools"
version = "0.1"
requires-python = "==3.14.*"
dependencies = [
    "pillow==13.0.0",
    "fonttools==4.66.1",
    "numpy==2.5.4",
]

[dependency-groups]
# The command-line installer and sample upload (tools/fm1_install.py, tools/fm1_sample_upload.py): MIDI to an FM-1.
device = [
    "mido==1.3.3",
    "python-rtmidi==1.5.8",
]
# Supply-chain checks (tools/osv_scan.sh runs osv-scanner; this lints the GitHub workflows): uv run --group audit zizmor .
audit = [
    "zizmor==1.30.1",
]
# The ABOUT screen's QR code (tools/gen_about_qr.py: segno encodes the address) and its check (tests/about_qr_test.py:
# zxing-cpp reads the rendered screen, illumination and all, as a phone's camera would).
qr = [
    "segno==1.6.6",
    "zxing-cpp==3.1.1",
]

[tool.uv]
package = false
default-groups = ["device", "audit", "qr"]
# A cooldown: nothing newer than a week can be locked, so a hijacked release has time to be noticed and pulled before
# it reaches this lock (docs/SECURITY.md).
exclude-newer = "7 days"
# Exceptions, each a security release taken before its week is up, with why (remove once the week has passed):
#   pillow 13.0.0 (2026-10-16): fixes GHSA-8g5g-8vmr-9782 (critical) and eight more published 2026-10-20 against
#   12.3.0; published by python-pillow/Pillow's wheels.yml through PyPI's trusted publishing (PEP 740 provenance)
exclude-newer-package = { pillow = "2026-10-17T00:00:00Z" }

# SPDX-License-Identifier: GPL-3.0-only
# ESTAMPIE: known vulnerabilities accepted in the build image (tools/toolchain.lock build-image), for
# tools/osv_scan.sh --config. Each is in a distroless base package (glibc, the gcc-14 runtime libraries, zlib) with no
# fix in Debian 13 yet (only in unstable); distroless rebuilds when Debian ships one. Exposure: the container has no
# network, no shell, no capabilities, a read-only root, and runs only JieLi's compiler on this repository's sources.
# Every entry expires: after ignoreUntil the scan fails again, so each is re-checked (update the digest first).

[[IgnoredVulns]]
id = "DEBIAN-CVE-2010-4756"
ignoreUntil = 2027-01-15
reason = "glibc in the distroless build image: no fix in Debian 13 yet; offline, unprivileged compile-only container"


# ESTAMPIE: known vulnerabilities accepted in the build image (tools/toolchain.lock build-image), for
# tools/osv_scan.sh --config. Each is in a Wolfi package of the image (glibc, libgcc, libstdc++) with no fix in Wolfi
# yet; tools/build_image.sh --update --publish takes the fix when Wolfi ships one (every five days, from
# .github/workflows/build-image.yml). Chainguard's advisories (CGA-) name each CVE, often twice. Exposure: the
# container has no network, no shell, no capabilities, a read-only root, and runs only JieLi's compiler on this
# repository's sources. Every entry expires: after ignoreUntil the scan fails again, so each is re-checked.

[[IgnoredVulns]]
id = "CGA-58w2-4q2m-5rmr"
ignoreUntil = 2027-01-15
reason = "glibc CVE-2026-100290 (regcomp / regexec after a failed allocation) in the Wolfi build image: no fix in Wolfi yet (Chainguard's advisory published 2026-11-19); offline, unprivileged compile-only container"

